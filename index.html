<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Result</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
}

/* Card */
.card {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  padding: 2rem;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  color: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
  margin-bottom: 1rem;
}

input {
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: 10px;
  margin-bottom: 1rem;
}

button {
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: 10px;
  background: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Result */
.result {
  margin-top: 1rem;
  background: rgba(255,255,255,0.15);
  padding: 1rem;
  border-radius: 10px;
  display: none;
}

/* Feedback */
.feedback {
  margin-top: 1.5rem;
}

#clickBtn {
  background: #27ae60;
  color: white;
}

#thanksMsg {
  margin-top: 0.5rem;
  font-size: 0.9rem;
}

#counter {
  margin-top: 0.5rem;
  font-size: 0.85rem;
}

.count {
  font-weight: bold;
  color: #2ecc71;
}

/* Disclaimer */
.disclaimer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.7);
}
</style>
</head>

<body>

<div class="card">
  <h2>Check Result</h2>

  <input type="email" id="email" placeholder="Enter your email">
  <button onclick="check()">Check</button>

  <div id="result" class="result"></div>

  <!-- Feedback -->
  <div class="feedback">
    <button id="clickBtn">✅ Click if it worked!!</button>
    <p id="thanksMsg"></p>
    <p id="counter"><span class="count">0</span> people confirmed it worked ✅</p>
  </div>
</div>

<div class="disclaimer">
  Website ini adalah website tes alternatif cek lulus/tidak sebagai capsis/capmpk di sesi berkas.
</div>

<script>
async function check() {
  const email = document.getElementById("email").value.trim();
  const resultBox = document.getElementById("result");

  if (!email) {
    alert("Enter email first");
    return;
  }

  resultBox.style.display = "block";
  resultBox.innerHTML = "Loading...";

  try {
    const res = await fetch(
      "https://script.google.com/macros/s/AKfycbwwQDfNsGH3uEyr_jm6TfcT_TL4hKhwyAaXXaJhKFzDY27TBNijlcEnJ7qaNZJocyC57A/exec?nisn=" 
      + encodeURIComponent(email)
    );

    const data = await res.json();

    if (data.found) {
      resultBox.innerHTML = `
        <b>Name:</b> ${data.nama}<br>
        <b>Class:</b> ${data.kelas}<br>
        <b>Status:</b> ${data.status}<br>
        <b>Info:</b> ${data.keterangan}
      `;
    } else {
      resultBox.innerHTML = "❌ Data not found";
    }

  } catch {
    resultBox.innerHTML = "⚠️ Error fetching data";
  }
}
</script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHXM8dUtJrGKAPooQtSAJFoU6j2H1aczA",
  authDomain: "clicks-counter-73118.firebaseapp.com",
  databaseURL: "https://clicks-counter-73118-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "clicks-counter-73118",
  storageBucket: "clicks-counter-73118.firebasestorage.app",
  messagingSenderId: "163291250859",
  appId: "1:163291250859:web:0e1da3044b36cf5f0937ee",
  measurementId: "G-P5J4Y071G0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const btn = document.getElementById("clickBtn");
const msg = document.getElementById("thanksMsg");
const counterEl = document.querySelector(".count");

const counterRef = ref(db, "clicks");

/* 🔴 LIVE COUNTER */
onValue(counterRef, (snapshot) => {
  const value = snapshot.val() || 0;
  counterEl.textContent = value;
});

/* 🔒 Anti spam */
if (localStorage.getItem("clicked")) {
  btn.disabled = true;
  btn.textContent = "✔️ Already clicked";
}

/* 🚀 Click */
btn.onclick = async () => {
  if (localStorage.getItem("clicked")) return;

  await runTransaction(counterRef, (current) => {
    return (current || 0) + 1;
  });

  localStorage.setItem("clicked", "true");

  btn.disabled = true;
  btn.textContent = "✔️ Submitted";
  msg.textContent = "Thanks for clicking! 🎉";
};
</script>

</body>
</html>
