<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Result</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    font-family: 'Poppins', sans-serif;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 2rem;
    border-radius: 20px;
    width: 320px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  h2 {
    margin-bottom: 1rem;
  }

  input {
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 10px;
    outline: none;
    margin-bottom: 1rem;
    font-size: 1rem;
  }

  button {
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    color: #333;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    transform: translateY(-2px);
  }

  .result {
    margin-top: 1.5rem;
    text-align: left;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.15);
    padding: 1rem;
    border-radius: 10px;
    display: none;
  }

  .loading {
    margin-top: 1rem;
    display: none;
  }

  .disclaimer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
    padding: 0 1rem;
    pointer-events: none;
    }
</style>
</head>
<div class="disclaimer">
  Website ini adalah website tes alternatif cek lulus/tidak sebagai capsis/capmpk di sesi berkas
</div>
<body>

<div class="card">
  <h2>Check Result</h2>
  <input type="email" id="email" placeholder="Enter your email">
  <button onclick="check()">Check</button>

  <div class="loading" id="loading">Loading...</div>
  <div class="result" id="result"></div>
</div>

<script>
async function check() {
  const email = document.getElementById("email").value.trim();
  const resultBox = document.getElementById("result");
  const loading = document.getElementById("loading");

  if (!email) {
    alert("Please enter your email");
    return;
  }

  resultBox.style.display = "none";
  loading.style.display = "block";

  try {
    const res = await fetch(
      "https://script.google.com/macros/s/AKfycbwwQDfNsGH3uEyr_jm6TfcT_TL4hKhwyAaXXaJhKFzDY27TBNijlcEnJ7qaNZJocyC57A/exec?nisn=" 
      + encodeURIComponent(email)
    );

    const data = await res.json();

    loading.style.display = "none";
    resultBox.style.display = "block";

    if (data.found) {
      resultBox.innerHTML = `
        <b>Name:</b> ${data.nama}<br>
        <b>Class:</b> ${data.kelas}<br>
        <b>Status:</b> ${data.status}<br>
        <b>Info:</b> ${data.keterangan}
      `;
    } else {
      resultBox.innerHTML = "❌ Data not found";
    }

  } catch (err) {
    loading.style.display = "none";
    resultBox.style.display = "block";
    resultBox.innerHTML = "⚠️ Error fetching data";
  }
}
</script>

</body>
</html>
